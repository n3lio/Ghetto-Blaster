<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghetto Blaster — Mini</title>
<style>
:root { --hue: 0; --accent: hsl(var(--hue),80%,55%); }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: #0a0a0b;
  color: #f0ebe4;
  width: 100vw; height: 100vh;
  overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-app-region: drag;
  user-select: none;
}
.cover {
  flex: 1;
  background: #161514 center/cover no-repeat;
  position: relative;
}
.cover .overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent 40%, rgba(0,0,0,0.85) 100%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 10px 14px;
}
.info { margin-bottom: 6px; }
.title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 0.72rem; color: rgba(240,235,228,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  -webkit-app-region: no-drag;
}
.controls button {
  background: none; border: none; color: #f0ebe4; cursor: pointer;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background 0.15s;
}
.controls button:hover { background: rgba(255,255,255,0.1); }
.controls .play-btn { width: 36px; height: 36px; background: var(--accent); color: #0a0a0b; }
.controls .play-btn:hover { filter: brightness(1.1); }
.progress {
  height: 5px; background: #2a2725; flex-shrink: 0; cursor: pointer; position: relative;
}
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s linear; }
.time-display {
  position: absolute; bottom: 8px; right: 10px;
  font-size: 0.6rem; color: rgba(240,235,228,0.7);
  pointer-events: none;
}
/* Light mode */
body.light { background: #fafaf7; color: #1a1714; }
body.light .overlay { background: linear-gradient(transparent 40%, rgba(255,255,255,0.9) 100%); }
body.light .title { color: #1a1714; }
body.light .artist { color: #5a534d; }
body.light .controls button { color: #1a1714; }
body.light .controls .play-btn { color: #fafaf7; }
body.light .progress { background: #d8d4cd; }
body.light .close-btn { background: rgba(255,255,255,0.7); color: #1a1714; }
body.light .time-display { color: rgba(26,23,20,0.6); }
.close-btn {
  position: absolute; top: 6px; right: 6px; z-index: 10;
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,0.6); border: none; color: #fff;
  font-size: 11px; cursor: pointer; line-height: 18px; text-align: center;
  -webkit-app-region: no-drag;
}
.close-btn:hover { background: rgba(224,85,85,0.8); }
</style>
</head>
<body>
<div class="cover" id="cover">
  <button class="close-btn" id="closeBtn" title="Close mini-player">×</button>
  <div class="overlay">
    <div class="info">
      <div class="title" id="miniTitle">—</div>
      <div class="artist" id="miniArtist">—</div>
    </div>
    <div class="controls">
      <button id="shuffleBtn" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="play-btn" id="playBtn" title="Play / Pause"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="showMainBtn" title="Show main window (library)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
</div>
<div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<span class="time-display" id="timeDisplay">0:00 / 0:00</span>

<script>
// Auth token from URL.
var params = new URLSearchParams(location.search);
var token = params.get('t') || '';
var headers = token ? { 'Authorization': 'Bearer ' + token } : {};

// Close button — also focus main window.
document.getElementById('closeBtn').addEventListener('click', function() {
  if (window.resonance && window.resonance.showMain) window.resonance.showMain();
  window.close();
});

// Controls → remote commands to the server.
function cmd(c) {
  fetch('/api/remote/command', {
    method: 'POST', headers: Object.assign({'Content-Type':'application/json'}, headers),
    body: JSON.stringify({ command: c })
  }).catch(function(){});
}
document.getElementById('playBtn').addEventListener('click', function() { cmd(isPlaying ? 'pause' : 'play'); });
document.getElementById('prevBtn').addEventListener('click', function() { cmd('prev'); });
document.getElementById('nextBtn').addEventListener('click', function() { cmd('next'); });
document.getElementById('shuffleBtn').addEventListener('click', function() { cmd('shuffle'); });
document.getElementById('showMainBtn').addEventListener('click', function() {
  if (window.resonance && window.resonance.showMain) window.resonance.showMain();
});

// WebSocket for live state.
var isPlaying = false;
var wsBase = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host;
var wsUrl = token ? wsBase + '/?t=' + encodeURIComponent(token) : wsBase;
function connectWS() {
  var ws = new WebSocket(wsUrl);
  ws.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === 'desktop:state') updateUI(msg.data);
      if (msg.type === 'state' && msg.data && msg.data.desktop) updateUI(msg.data.desktop);
    } catch(ex) {}
  };
  ws.onclose = function() { setTimeout(connectWS, 3000); };
  ws.onerror = function() { ws.close(); };
}
connectWS();

// Also fetch initial state.
fetch('/api/desktop/state', { headers: headers }).then(function(r){return r.json();}).then(updateUI).catch(function(){});

function updateUI(d) {
  if (!d) return;
  document.getElementById('miniTitle').textContent = d.title || '—';
  document.getElementById('miniArtist').textContent = d.artist || '—';
  isPlaying = !!d.isPlaying;
  // Play/pause icon.
  var pb = document.getElementById('playBtn');
  pb.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>';
  // Cover.
  if (d.hasCover && d.trackId != null) {
    var url = '/api/cover/' + d.trackId + (token ? '?t=' + encodeURIComponent(token) : '');
    document.getElementById('cover').style.backgroundImage = 'url(' + url + ')';
  }
  // Progress + time display.
  currentDuration = d.duration || 0;
  currentProgress = d.progress || 0;
  if (d.duration > 0) {
    var pct = Math.min(100, (d.progress / d.duration) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
  }
  function fmt(s) { var m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
  document.getElementById('timeDisplay').textContent = fmt(currentProgress) + ' / ' + fmt(currentDuration);
  // Accent hue from theme.
  if (d.hue != null) document.documentElement.style.setProperty('--hue', d.hue);
}

// Seek on progress bar click.
var currentDuration = 0, currentProgress = 0;
document.getElementById('progressBar').addEventListener('click', function(e) {
  if (!currentDuration) return;
  var rect = this.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  var seekTo = pct * currentDuration;
  cmd('seek');
  // Use the dedicated seek command with position.
  fetch('/api/remote/command', {
    method: 'POST', headers: Object.assign({'Content-Type':'application/json'}, headers),
    body: JSON.stringify({ command: 'seek', position: seekTo })
  }).catch(function(){});
});

// Light mode detection from URL param or OS preference.
(function() {
  var params = new URLSearchParams(location.search);
  var theme = params.get('theme');
  if (theme === 'light') document.body.classList.add('light');
  else if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.classList.add('light');
  }
})();

// Drag (JS-based).
var dragStart = null;
document.body.addEventListener('mousedown', function(e) {
  if (e.target.closest('button')) return;
  dragStart = { x: e.screenX, y: e.screenY };
});
document.addEventListener('mousemove', function(e) {
  if (!dragStart) return;
  var dx = e.screenX - dragStart.x, dy = e.screenY - dragStart.y;
  dragStart = { x: e.screenX, y: e.screenY };
  // Use Electron's IPC if available (loaded via preload), else noop.
  if (window.resonance && window.resonance.moveWindow) window.resonance.moveWindow(dx, dy);
});
document.addEventListener('mouseup', function() { dragStart = null; });
</script>
</body>
</html>
